{% extends "base.html" %}

{% block title %}Edit {{ warehouse.name }} - Warehouse App{% endblock %}

{% block content %}
<h1>Edit Warehouse</h1>

{% if error %}
<div class="error">{{ error }}</div>
{% endif %}

<form method="POST">
    <div class="form-group">
        <label for="name">Warehouse Name:</label>
        <input type="text" id="name" name="name" value="{{ warehouse.name }}" required>
    </div>
    <button type="submit" class="btn btn-success">Save Changes</button>
    <a href="{{ url_for('view_warehouse', warehouse_id=warehouse_id) }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
